name: Test Suites

# We are a reusable Workflow only
on:
  workflow_call:
    secrets:
      SLACK_WEBHOOK_URL:
        required: false

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    env:
      DB_USER: root
      DB_PASSWORD: root
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        cfengine: [ "boxlang-cfml@1", "boxlang@1" ]
        coldboxVersion: [ "^8.0.0" ]
        experimental: [ false ]
        # Experimental: ColdBox BE vs BoxLang engines
        include:
          - coldboxVersion: "be"
            cfengine: "boxlang-cfml@1"
            experimental: true
          - coldboxVersion: "be"
            cfengine: "boxlang-cfml@be"
            experimental: true
          - coldboxVersion: "be"
            cfengine: "boxlang@1"
            experimental: true
          - coldboxVersion: "be"
            cfengine: "boxlang@be"
            experimental: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      # TEMPORARY: cborm 6 needs bx-orm 2, which is not published yet. Build it from its migration branch and
      # install that zip (the server configs read BXORM_PACKAGE). Remove this step once bx-orm 2 is on ForgeBox.
      - name: Build bx-orm 2 (temporary, until it is published)
        run: |
          git clone --depth 1 --branch claude/hibernate-7.4-migration-q8zu9n https://github.com/ortus-boxlang/bx-orm.git "$RUNNER_TEMP/bx-orm"
          cd "$RUNNER_TEMP/bx-orm"
          # The Gradle plugin portal sometimes fails to serve a dependency: retry up to 3 times
          retry() { for i in 1 2 3; do "$@" && return 0; echo "Attempt $i failed: $*"; sleep $(( i * 15 )); done; return 1; }
          retry ./gradlew downloadBoxLang --console=plain
          retry ./gradlew build -x test -x javadoc --console=plain
          BXORM_ZIP=$( ls "$PWD"/build/distributions/bx-orm-*.zip | grep -v javadocs | head -n 1 )
          echo "Built $BXORM_ZIP"
          echo "BXORM_PACKAGE=$BXORM_ZIP" >> "$GITHUB_ENV"

      - name: Setup Database and Fixtures
        run: |
            sudo systemctl start mysql.service
            # Create Database
            mysql -u${{ env.DB_USER }} -p${{ env.DB_PASSWORD }} -e 'CREATE DATABASE coolblog;'
            # Import Database
            mysql -u${{ env.DB_USER }} -p${{ env.DB_PASSWORD }} < test-harness/tests/resources/coolblog.sql

      - name: Setup Environment For Testing Process
        run: |
          # Setup .env
          touch .env
          # ENV
          printf "ENVIRONMENT=development\n" >> .env
          printf "DB_HOST=localhost\n" >> .env
          printf "DB_USER=${{ env.DB_USER }}\n" >> .env
          printf "DB_PASSWORD=${{ env.DB_PASSWORD }}\n" >> .env
          printf "DB_CLASS=com.mysql.cj.jdbc.Driver\n" >> .env
          printf "DB_BUNDLEVERSION=8.0.19\n" >> .env
          printf "DB_BUNDLENAME=com.mysql.cj\n" >> .env

      - name: Setup CommandBox and BoxLang
        uses: ortus-boxlang/setup-boxlang@main
        with:
          with-commandbox: true

      - name: Install Dependencies
        run: |
          box install
          cd test-harness
          box package set dependencies.coldbox=${{ matrix.coldboxVersion }}
          box install

      - name: Start ${{ matrix.cfengine }} Server
        run: |
          box server start serverConfigFile="server-${{ matrix.cfengine }}.json" --noSaveSettings --debug
          curl http://127.0.0.1:60299

      - name: Run Tests
        run: |
          mkdir -p test-harness/tests/results
          box testbox run --verbose outputFile=test-harness/tests/results/test-results outputFormats=json,antjunit

      - name: Publish Test Reports
        uses: mikepenz/action-junit-report@v6.5.0
        if: always()
        with:
          report_paths: |
            test-harness/tests/results/**/*.xml
          check_name: "TestBox Report ${{ matrix.cfengine }}-${{ matrix.coldboxVersion }}"
          include_passed: false
          fail_on_failure: true
          detailed_summary: true

      - name: Upload Test Results to Artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-results-${{ matrix.cfengine }}-${{ matrix.coldboxVersion }}
          path: |
            test-harness/tests/results/**/*

      - name: Show Server Log On Failures
        if: ${{ failure() }}
        run: |
          box server log serverConfigFile="server-${{ matrix.cfengine }}.json"

      - name: Upload Debug Logs To Artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Failure Debugging Info - ${{ matrix.cfengine }} - ${{ matrix.coldboxVersion }}
          path: |
            .engine/**/logs/*

      - name: Slack Notifications
        # Only on failures and NOT in pull requests
        if: ${{ failure() && !startsWith( 'pull_request', github.event_name ) }}
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_CHANNEL: coding
          SLACK_COLOR: ${{ job.status }} # or a specific color like 'green' or '#ff00ff'
          SLACK_ICON_EMOJI: ":bell:"
          SLACK_MESSAGE: '${{ github.repository }} tests failed :cry:'
          SLACK_TITLE: ${{ github.repository }} Tests For ${{ matrix.cfengine }} with ColdBox ${{ matrix.coldboxVersion }} failed
          SLACK_USERNAME: CI
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
